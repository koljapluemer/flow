[project]
name = "flowcms"
version = "0.1.0"
description = "Builds data/repo from data/in and renders it to public/data"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.23",
    "openai>=1.99",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowcms"]
