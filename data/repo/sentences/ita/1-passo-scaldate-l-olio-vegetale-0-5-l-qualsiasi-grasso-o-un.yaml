text: 1° passo. Scaldate l'olio vegetale (0,5 L) (qualsiasi grasso o una miscela di olio e grasso) nella pentola a fuoco vivace, aggiungete le cipolle a fette (400 g), friggete fino a quando le cipolle prendono un colore giallo, poi aggiungete la carne (di qualsiasi tipo) (1 kg).
translation: Step 1. Heat the vegetable oil (0.5L) (any grease or a mixture of oil and grease) in the pot on high heat, add sliced onions (400g), fry until the onions take a yellow color, then add meat (any kind) (1kg).
