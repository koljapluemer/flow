text: Gli alberi pietrificati di Yellowstone sono il risultato di flussi di detriti vulcanici verificatisi circa cinquanta milioni di anni fa.
translation: Petrified trees in Yellowstone are the result of volcanic debris flows that occurred about 50 million years ago.
